name: Telegram read-only research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: telegram-read-only-research
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
    steps:
      - name: Check Telegram credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '未启用：请先配置 TG_API_ID / TG_API_HASH / TG_STRING_SESSION 三个 Secrets。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Install read-only dependencies
        if: steps.creds.outputs.ready == 'true'
        run: python -m pip install -r telegram_research/requirements.txt
      - name: Collect index, without downloading PDFs
        if: steps.creds.outputs.ready == 'true'
        run: python -m telegram_research.reader --channel shenduhaowen --days 3 --max-messages 200
      - name: Display summary
        if: steps.creds.outputs.ready == 'true'
        run: cat reports/telegram/brief.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: telegram-research-${{ github.run_id }}
          path: reports/telegram/
          if-no-files-found: error
          retention-days: 7
