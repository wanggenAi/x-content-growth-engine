name: Telegram read-only research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: telegram-read-only-research
  cancel-in-progress: false
jobs:
  index:
    # Optional dedicated self-hosted runner; its external state directory persists.
    runs-on: ${{ fromJSON(vars.TG_RUNNER_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
    steps:
      - name: Check Telegram credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'SKIPPED: Telegram credentials are not configured. Collection is NOT active.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Install dependencies and test
        if: steps.creds.outputs.ready == 'true'
        run: |
          python -m pip install -q -r telegram_research/requirements.txt
          python -m unittest discover -s tests -q
      - name: Collect privately; public output contains counts only
        if: steps.creds.outputs.ready == 'true'
        env:
          TG_STATE_DIR: ${{ vars.TG_STATE_DIR || format('{0}/telegram-research-state', runner.temp) }}
        run: python -m telegram_research.reader --channel shenduhaowen --incremental --max-messages 500 --public-status reports/telegram/status.md
      - name: Success summary
        if: success() && steps.creds.outputs.ready == 'true'
        run: cat reports/telegram/status.md >> "$GITHUB_STEP_SUMMARY"
      - name: Failure summary
        if: failure()
        run: echo 'FAILED. Check sanitized error type in collection step. No private files were uploaded.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success() && steps.creds.outputs.ready == 'true'
        with:
          name: telegram-status-${{ github.run_id }}
          path: reports/telegram/status.md
          if-no-files-found: error
          retention-days: 7
