name: legacy-viral-research-manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect research leads only, never publish
        run: python3 -m growth_engine collect-feed --output-root data/viral_feed --limit 100
      - name: Verify collection cannot trigger X publication
        run: |
          python3 -c 'import json; p=json.load(open("data/viral_feed/latest.json")); assert p["publication_triggered"] is False; assert p["automatic_x_submission"] is False'
      - name: Preserve packet
        uses: actions/upload-artifact@v4
        with:
          name: legacy-viral-feed
          path: data/viral_feed/
          retention-days: 14
