name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run local standard-library tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python3 -m compileall -q growth_engine tests
      - name: Install test runner (no runtime dependency)
        run: python3 -m pip install 'pytest>=8,<9'
      - name: Run pytest
        run: python3 -m pytest -q
